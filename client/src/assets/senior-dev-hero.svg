<svg width="720" height="520" viewBox="0 0 720 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Neon developer workspace</title>
  <desc id="desc">A simple neon illustration of a developer laptop, orbiting UI panels, and abstract 3D shapes.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="80" x2="650" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080A12"/>
      <stop offset="0.55" stop-color="#101426"/>
      <stop offset="1" stop-color="#06070D"/>
    </linearGradient>
    <linearGradient id="violet" x1="204" y1="116" x2="545" y2="397" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.48" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="blue" x1="235" y1="252" x2="500" y2="391" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="72" y="44" width="576" height="424" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.27 0 0 0 0 0.38 0 0 0 0 1 0 0 0 0.55 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <filter id="shadow" x="62" y="42" width="596" height="436" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="76" y="64" width="568" height="392" rx="28" fill="url(#bg)" stroke="#1F2937" filter="url(#shadow)"/>
  <rect x="96" y="84" width="528" height="352" rx="20" fill="#030712" opacity="0.82"/>
  <g opacity="0.28">
